name: Build External Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Target Repo
      uses: actions/checkout@v4
      with:
        repository: MahdiAhmadnejad/Image-Labeler-android
        path: '.'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Patch Dead Dependency & Code
      run: |
        # 1. Overwrite app/build.gradle dengan signingConfigs yang benar
        echo "" | base64 -d > app/build.gradle

        # 2. Overwrite ShowLabel.kt
        echo "" | base64 -d > app/src/main/java/com/eye/imagelaberlecropperkotlin/ShowLabel.kt

        # 3. Overwrite MainActivity.kt
        echo "" | base64 -d > app/src/main/java/com/eye/imagelaberlecropperkotlin/MainActivity.kt

    # DECODE KEYSTORE TANPA ACTION PIHAK KETIGA (100% RELIABLE)
    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release_keystore.jks

    - name: Build & Sign Release APK
      env:
        # Path di-set eksplisit, tidak bergantung output action lain
        KEYSTORE_FILE: app/release_keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Image-Labeler-Signed-APK
        path: app/build/outputs/apk/**/*.apk
