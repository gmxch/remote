name: Build External Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Target Repo
      uses: actions/checkout@v4
      with:
        repository: MahdiAhmadnejad/Image-Labeler-android
        path: '.'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Patch Dead Dependency (Auto-Fix)
      run: |
        # 1. Ganti dependency mati dengan fork aktif (Vanniktech/CanHub)
        sed -i 's/com.theartofdev.edmodo:android-image-cropper:2.8.0/com.vanniktech:android-image-cropper:4.5.0/g' app/build.gradle
        
        # 2. Update package import di semua file .kt
        find app/src -name "*.kt" -exec sed -i 's/com.theartofdev.edmodo.cropper/com.canhub.cropper/g' {} +

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v1.2
      with:
        fileName: 'release_keystore.jks'
        encodedString: ${{ secrets.KEYSTORE_BASE64 }}

    - name: Build & Sign Release APK
      env:
        KEYSTORE_FILE: ${{ steps.decode_keystore.outputs.filePath }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Image-Labeler-Signed-APK
        path: app/build/outputs/apk/release/app-release.apk
