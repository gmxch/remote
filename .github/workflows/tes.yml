name: multi arch
on: workflow_dispatch

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone cfsolve
        run: git clone https://github.com/chris124567/cfsolve.git repo

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libclang-dev git perl pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Build challenge
        working-directory: repo
        run: cargo build --release --bin challenge

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: challenge-${{ matrix.arch }}
          path: repo/target/release/challenge
          if-no-files-found: error
