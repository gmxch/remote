name: Build ARM64 Binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: aarch64-unknown-linux-gnu
          components: clippy, rustfmt

      - name: Install cross (Docker-based cross compiler)
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build challenge binary for ARM64
        run: cross build --release --bin challenge --target aarch64-unknown-linux-gnu

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: challenge-aarch64
          path: target/aarch64-unknown-linux-gnu/release/challenge
          if-no-files-found: error
